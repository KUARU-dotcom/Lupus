name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build (release)
        run: cargo build --release --locked
      - name: Fetch oracle v0.4.0
        run: bash scripts/fetch-oracle.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test
        run: cargo test --locked
        env:
          LUPUS_ORACLE_REQUIRED: "1"
          LUPUS_FUZZ_N: "20000"
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --check

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --locked
      - name: Fetch differential baseline v0.5.2
        run: gh release download v0.5.2 --pattern 'lupus-v0.5.2-linux-x86_64.tar.gz' --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Release tests
        run: >
          cargo test --release --locked --no-fail-fast
          --test memory
          --test gc_performance
          --test property
          --test differential
          --test shrinker
        env:
          LUPUS_DIFF_REQUIRED: "1"
      - name: Differential report
        run: cargo test --release --locked --test differential -- --nocapture
        env:
          LUPUS_DIFF_REQUIRED: "1"
      - name: GC pause limit check
        run: cargo test --release --locked --test memory memory_leak_containers -- --nocapture

  # Job проверяет компилируемость и тесты на настоящей Windows (host MSVC).
  # Это НЕ источник релизного артефакта: релизный .zip собирается на машине
  # мейнтейнера (CachyOS) через ./build_release.sh <version> (mingw-w64) или
  # через Dockerfile.release.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --locked
      - name: Version
        run: ./target/release/lupus.exe --version
      # Порог GC-регресса 5% остаётся дефолтом для локальных прогонов.
      # На windows-latest debug-сборка без оптимизаций шумит сильнее,
      # поэтому запас поднят только в этом job'е.
      - name: Test
        run: cargo test --locked
        env:
          LUPUS_GC_PERF_REGRESSION_PCT: "15"
          LUPUS_GC_PAUSE_LIMIT_US: "40000"
