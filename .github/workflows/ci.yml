name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build (release)
        run: cargo build --release --locked
      - name: Fetch oracle v0.4.0
        run: bash scripts/fetch-oracle.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test
        run: cargo test --locked
        env:
          LUPUS_ORACLE_REQUIRED: "1"
          LUPUS_FUZZ_N: "20000"
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --check

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --locked
      - name: Release tests
        run: >
          cargo test --release --locked --no-fail-fast
          --test memory
          --test gc_performance
          --test property
          --test differential
          --test shrinker
      - name: GC pause limit check
        run: cargo test --release --locked --test memory memory_leak_containers -- --nocapture

  # Job проверяет компилируемость и тесты на настоящей Windows (host MSVC).
  # Это НЕ источник релизного артефакта: релизный .zip собирается на машине
  # мейнтейнера (CachyOS) через ./build_release.sh <version> (mingw-w64) или
  # через Dockerfile.release.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --locked
      - name: Version
        run: ./target/release/lupus.exe --version
      - name: Test
        run: cargo test --locked
